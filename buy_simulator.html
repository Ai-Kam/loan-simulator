<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>購入タイミングシミュレータ</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f5f7fa;
      --panel: #ffffff;
      --line: #d6dde8;
      --text: #162033;
      --muted: #667085;
      --rent: #146c94;
      --own: #b54708;
      --asset: #24715d;
      --cash: #6941c6;
      --accent: #0f766e;
      --soft: #eef2f7;
      --danger: #b42318;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      line-height: 1.5;
    }

    main {
      width: min(1280px, calc(100vw - 28px));
      margin: 22px auto 44px;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 16px;
    }

    h1 {
      margin: 0;
      font-size: 26px;
      letter-spacing: 0;
    }

    h2 {
      margin: 24px 0 10px;
      font-size: 18px;
      letter-spacing: 0;
    }

    a {
      color: var(--accent);
      font-weight: 700;
      text-decoration: none;
    }

    a:hover {
      text-decoration: underline;
    }

    .layout {
      display: grid;
      grid-template-columns: 356px minmax(0, 1fr);
      gap: 16px;
      align-items: start;
    }

    .panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      box-shadow: 0 1px 2px rgba(20, 31, 49, 0.05);
    }

    .controls {
      padding: 16px;
      position: sticky;
      top: 14px;
    }

    .group-title {
      margin: 16px 0 8px;
      color: #344054;
      font-size: 13px;
      font-weight: 800;
    }

    .group-title:first-child {
      margin-top: 0;
    }

    .field-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    label {
      display: grid;
      gap: 6px;
      color: #344054;
      font-size: 13px;
      font-weight: 650;
      min-width: 0;
    }

    input {
      width: 100%;
      height: 40px;
      border: 1px solid #b9c2cf;
      border-radius: 6px;
      padding: 8px 10px;
      color: var(--text);
      background: #ffffff;
      font: inherit;
    }

    input:focus {
      outline: 2px solid rgba(15, 118, 110, 0.25);
      border-color: var(--accent);
    }

    .wide {
      grid-column: 1 / -1;
    }

    .actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-top: 16px;
    }

    button {
      min-height: 40px;
      border: 1px solid #aab4c2;
      border-radius: 6px;
      padding: 8px 10px;
      background: #ffffff;
      color: #1f2937;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
    }

    button.primary {
      border-color: var(--accent);
      background: var(--accent);
      color: #ffffff;
    }

    button:hover {
      filter: brightness(0.98);
    }

    .error {
      min-height: 20px;
      margin: 12px 0 0;
      color: var(--danger);
      font-size: 13px;
    }

    .results {
      min-width: 0;
    }

    .metrics {
      display: grid;
      grid-template-columns: repeat(4, minmax(150px, 1fr));
      gap: 10px;
      padding: 16px;
    }

    .metric {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fafbfc;
      padding: 10px 12px;
      min-width: 0;
    }

    .metric span {
      display: block;
      color: var(--muted);
      font-size: 12px;
      margin-bottom: 4px;
    }

    .metric strong {
      display: block;
      font-size: 18px;
      overflow-wrap: anywhere;
    }

    .metric.good strong {
      color: var(--asset);
    }

    .metric.warn strong {
      color: var(--own);
    }

    .chart-panel {
      margin-top: 14px;
      padding: 12px;
    }

    .chart-wrap {
      overflow-x: auto;
    }

    svg {
      display: block;
      width: 100%;
      min-width: 860px;
      height: auto;
      background: #ffffff;
    }

    .axis {
      stroke: #8a94a6;
      stroke-width: 1;
      shape-rendering: crispEdges;
    }

    .grid {
      stroke: #e7ebf0;
      stroke-width: 1;
      shape-rendering: crispEdges;
    }

    .tick-text {
      fill: #667085;
      font-size: 12px;
    }

    .axis-title,
    .legend {
      font-size: 13px;
      font-weight: 700;
    }

    .panel-title {
      fill: #344054;
      font-size: 13px;
      font-weight: 800;
    }

    .line-rent,
    .line-own,
    .line-asset,
    .line-cash,
    .line-advantage {
      fill: none;
      stroke-width: 2.75;
      stroke-linejoin: round;
      stroke-linecap: round;
    }

    .line-rent {
      stroke: var(--rent);
    }

    .line-own {
      stroke: var(--own);
      stroke-dasharray: 7 5;
    }

    .line-asset {
      stroke: var(--asset);
    }

    .line-cash {
      stroke: var(--cash);
      stroke-dasharray: 3 5;
    }

    .line-advantage {
      stroke: #475467;
    }

    .table-wrap {
      overflow-x: auto;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #ffffff;
    }

    table {
      width: 100%;
      min-width: 1040px;
      border-collapse: collapse;
      font-size: 14px;
    }

    th,
    td {
      padding: 9px 11px;
      border-bottom: 1px solid var(--line);
      text-align: right;
      white-space: nowrap;
    }

    th {
      background: var(--soft);
      color: #344054;
      font-weight: 700;
    }

    th:first-child,
    td:first-child {
      text-align: left;
    }

    .site-footer {
      width: min(1280px, calc(100vw - 28px));
      margin: -22px auto 32px;
      color: var(--muted);
      font-size: 12px;
      text-align: right;
    }

    @media (max-width: 980px) {
      .layout {
        grid-template-columns: 1fr;
      }

      .controls {
        position: static;
      }

      .metrics {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }

    @media (max-width: 620px) {
      header {
        align-items: flex-start;
        flex-direction: column;
      }

      .field-grid,
      .actions,
      .metrics {
        grid-template-columns: 1fr;
      }

      .site-footer {
        text-align: left;
      }
    }
  </style>
</head>
<body>
<main>
  <header>
    <h1>購入タイミングシミュレータ</h1>
    <a href="index.html">ローンシミュレータ</a>
  </header>

  <div class="layout">
    <section class="panel controls" aria-label="入力条件">
      <div class="group-title">基本条件</div>
      <div class="field-grid">
        <label>
          現在金融資産 x
          <input id="assets" type="number" min="0" step="10000" value="8000000" inputmode="numeric">
        </label>
        <label>
          期待運用利回り p（%）
          <input id="returnRate" type="number" step="0.1" value="4.0" inputmode="decimal">
        </label>
        <label>
          同等物件の月額家賃 z
          <input id="monthlyRent" type="number" min="0" step="1000" value="180000" inputmode="numeric">
        </label>
        <label>
          現在住宅価格 h
          <input id="homePrice" type="number" min="1" step="100000" value="60000000" inputmode="numeric">
        </label>
        <label>
          住宅ローン金利 k（%）
          <input id="mortgageRate" type="number" min="0" step="0.01" value="0.8" inputmode="decimal">
        </label>
        <label>
          ローン年数 N
          <input id="loanYears" type="number" min="1" max="80" step="1" value="35" inputmode="numeric">
        </label>
      </div>

      <div class="group-title">購入可能性</div>
      <div class="field-grid">
        <label>
          頭金比率 d（%）
          <input id="downPaymentRate" type="number" min="0" max="100" step="1" value="10" inputmode="decimal">
        </label>
        <label>
          生活防衛資金
          <input id="emergencyFund" type="number" min="0" step="10000" value="3000000" inputmode="numeric">
        </label>
        <label>
          住居費・貯蓄 合計予算
          <input id="annualBudget" type="number" step="10000" value="3960000" inputmode="numeric">
        </label>
        <label>
          予算上昇率（%）
          <input id="budgetGrowthRate" type="number" step="0.1" value="1.0" inputmode="decimal">
        </label>
      </div>

      <div class="group-title">価格・費用</div>
      <div class="field-grid">
        <label>
          住宅価格変化率 g（%）
          <input id="homeGrowthRate" type="number" step="0.1" value="0.5" inputmode="decimal">
        </label>
        <label>
          家賃上昇率 r（%）
          <input id="rentGrowthRate" type="number" step="0.1" value="1.0" inputmode="decimal">
        </label>
        <label>
          固定資産税等 tau（%）
          <input id="taxRate" type="number" min="0" step="0.05" value="0.35" inputmode="decimal">
        </label>
        <label>
          維持管理修繕 m（%）
          <input id="maintenanceRate" type="number" min="0" step="0.05" value="0.8" inputmode="decimal">
        </label>
        <label>
          保険その他 i（%）
          <input id="insuranceRate" type="number" min="0" step="0.05" value="0.1" inputmode="decimal">
        </label>
        <label>
          購入諸費用 c_b（%）
          <input id="buyCostRate" type="number" min="0" step="0.1" value="6.0" inputmode="decimal">
        </label>
        <label>
          売却費用 c_s（%）
          <input id="sellCostRate" type="number" min="0" step="0.1" value="3.5" inputmode="decimal">
        </label>
        <label>
          居住予定年数 T
          <input id="stayYears" type="number" min="1" max="80" step="1" value="20" inputmode="numeric">
        </label>
        <label class="wide">
          購入時期の探索年数
          <input id="maxWaitYears" type="number" min="0" max="80" step="1" value="25" inputmode="numeric">
        </label>
      </div>

      <div class="actions">
        <button class="primary" id="updateButton" type="button">再計算</button>
        <button id="saveCsvButton" type="button">CSV保存</button>
      </div>
      <p class="error" id="errorMessage" aria-live="polite"></p>
    </section>

    <section class="results">
      <div class="panel metrics" id="metrics" aria-label="計算結果"></div>

      <section class="panel chart-panel">
        <div class="chart-wrap">
          <svg id="timingChart" viewBox="0 0 1120 720" role="img" aria-label="購入タイミングの比較グラフ"></svg>
        </div>
      </section>

      <h2>購入時期別サマリー</h2>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>購入時期</th>
              <th>年間予算</th>
              <th>家賃年額</th>
              <th>賃貸時投資額</th>
              <th>所有住居費</th>
              <th>購入後最低余力</th>
              <th>購入時資産</th>
              <th>必要現金</th>
              <th>判定</th>
              <th>純資産差</th>
            </tr>
          </thead>
          <tbody id="summaryRows"></tbody>
        </table>
      </div>
    </section>
  </div>
</main>
<footer class="site-footer">Copyright (c) 2026 Aihisa Kamijo. All rights reserved.</footer>

<script>
  const COPYRIGHT_NOTICE = "Copyright (c) 2026 Aihisa Kamijo. All rights reserved.";
  const chart = document.getElementById("timingChart");
  const summaryRowsEl = document.getElementById("summaryRows");
  const metricsEl = document.getElementById("metrics");
  const errorEl = document.getElementById("errorMessage");
  let currentRows = [];

  const inputs = {
    assets: document.getElementById("assets"),
    returnRate: document.getElementById("returnRate"),
    monthlyRent: document.getElementById("monthlyRent"),
    homePrice: document.getElementById("homePrice"),
    mortgageRate: document.getElementById("mortgageRate"),
    loanYears: document.getElementById("loanYears"),
    downPaymentRate: document.getElementById("downPaymentRate"),
    emergencyFund: document.getElementById("emergencyFund"),
    annualBudget: document.getElementById("annualBudget"),
    budgetGrowthRate: document.getElementById("budgetGrowthRate"),
    homeGrowthRate: document.getElementById("homeGrowthRate"),
    rentGrowthRate: document.getElementById("rentGrowthRate"),
    taxRate: document.getElementById("taxRate"),
    maintenanceRate: document.getElementById("maintenanceRate"),
    insuranceRate: document.getElementById("insuranceRate"),
    buyCostRate: document.getElementById("buyCostRate"),
    sellCostRate: document.getElementById("sellCostRate"),
    stayYears: document.getElementById("stayYears"),
    maxWaitYears: document.getElementById("maxWaitYears"),
  };

  function yen(value) {
    return `${Math.round(value).toLocaleString("ja-JP")} 円`;
  }

  function signedYen(value) {
    const sign = value > 0 ? "+" : "";
    return `${sign}${yen(value)}`;
  }

  function pct(value) {
    return value / 100;
  }

  function readNumber(id, label, options = {}) {
    const value = Number(inputs[id].value);
    if (!Number.isFinite(value)) {
      throw new Error(`${label}は数値で入力してください。`);
    }
    if (options.integer && !Number.isInteger(value)) {
      throw new Error(`${label}は整数で入力してください。`);
    }
    if (options.min !== undefined && value < options.min) {
      throw new Error(`${label}は${options.min}以上で入力してください。`);
    }
    if (options.max !== undefined && value > options.max) {
      throw new Error(`${label}は${options.max}以下で入力してください。`);
    }
    return value;
  }

  function readInputs() {
    const config = {
      assets: readNumber("assets", "現在金融資産", { min: 0 }),
      returnRate: pct(readNumber("returnRate", "期待運用利回り")),
      annualRent: readNumber("monthlyRent", "同等物件の月額家賃", { min: 0 }) * 12,
      homePrice: readNumber("homePrice", "現在住宅価格", { min: 1 }),
      mortgageRate: pct(readNumber("mortgageRate", "住宅ローン金利", { min: 0 })),
      loanYears: readNumber("loanYears", "ローン年数", { integer: true, min: 1 }),
      downPaymentRate: pct(readNumber("downPaymentRate", "頭金比率", { min: 0, max: 100 })),
      emergencyFund: readNumber("emergencyFund", "生活防衛資金", { min: 0 }),
      baseAnnualBudget: readNumber("annualBudget", "住居費・貯蓄 合計予算"),
      budgetGrowthRate: pct(readNumber("budgetGrowthRate", "予算上昇率")),
      homeGrowthRate: pct(readNumber("homeGrowthRate", "住宅価格変化率")),
      rentGrowthRate: pct(readNumber("rentGrowthRate", "家賃上昇率")),
      taxRate: pct(readNumber("taxRate", "固定資産税等", { min: 0 })),
      maintenanceRate: pct(readNumber("maintenanceRate", "維持管理修繕", { min: 0 })),
      insuranceRate: pct(readNumber("insuranceRate", "保険その他", { min: 0 })),
      buyCostRate: pct(readNumber("buyCostRate", "購入諸費用", { min: 0 })),
      sellCostRate: pct(readNumber("sellCostRate", "売却費用", { min: 0 })),
      stayYears: readNumber("stayYears", "居住予定年数", { integer: true, min: 1 }),
      maxWaitYears: readNumber("maxWaitYears", "購入時期の探索年数", { integer: true, min: 0 }),
    };

    return config;
  }

  function annualRentAt(config, year) {
    return config.annualRent * Math.pow(1 + config.rentGrowthRate, year);
  }

  function homePriceAt(config, year) {
    return config.homePrice * Math.pow(1 + config.homeGrowthRate, year);
  }

  function annualBudgetAt(config, year) {
    return config.baseAnnualBudget * Math.pow(1 + config.budgetGrowthRate, year);
  }

  function yearlyPayment(loan, annualRate, years) {
    if (loan <= 0) return 0;
    const months = years * 12;
    const monthlyRate = annualRate / 12;
    if (Math.abs(monthlyRate) < 1e-12) {
      return loan / months * 12;
    }
    const monthly = loan * monthlyRate / (1 - Math.pow(1 + monthlyRate, -months));
    return monthly * 12;
  }

  function mortgageBalanceAfter(loan, annualRate, years, elapsedYears) {
    if (loan <= 0) return 0;
    const totalMonths = years * 12;
    const months = Math.min(totalMonths, Math.max(0, elapsedYears * 12));
    const monthlyRate = annualRate / 12;
    const monthly = yearlyPayment(loan, annualRate, years) / 12;
    let balance = loan;

    for (let month = 0; month < months; month += 1) {
      if (balance <= 0) return 0;
      const interest = balance * monthlyRate;
      const principal = Math.max(0, monthly - interest);
      balance = Math.max(0, balance - principal);
    }
    return balance;
  }

  function simulateNetWorth(config, waitYears, row) {
    const totalYears = waitYears + config.stayYears;
    let rentNetWorth = config.assets;
    for (let year = 0; year < totalYears; year += 1) {
      rentNetWorth = rentNetWorth * (1 + config.returnRate) + (annualBudgetAt(config, year) - annualRentAt(config, year));
    }

    let investedAssets = config.assets;
    for (let year = 0; year < waitYears; year += 1) {
      investedAssets = investedAssets * (1 + config.returnRate) + (annualBudgetAt(config, year) - annualRentAt(config, year));
    }
    investedAssets -= row.requiredCashBeforeEmergency;

    for (let ownedYear = 0; ownedYear < config.stayYears; ownedYear += 1) {
      const globalYear = waitYears + ownedYear;
      const operatingCost = homePriceAt(config, globalYear) * row.operatingCostRate;
      const loanPayment = ownedYear < config.loanYears ? row.annualLoanPayment : 0;
      const annualContribution = annualBudgetAt(config, globalYear) - loanPayment - operatingCost;
      investedAssets = investedAssets * (1 + config.returnRate) + annualContribution;
    }

    const salePrice = homePriceAt(config, totalYears);
    const saleCost = salePrice * config.sellCostRate;
    const remainingLoan = mortgageBalanceAfter(row.loan, config.mortgageRate, config.loanYears, config.stayYears);
    const buyNetWorth = investedAssets + salePrice - saleCost - remainingLoan;

    return {
      rentNetWorth,
      buyNetWorth,
      netAdvantage: buyNetWorth - rentNetWorth,
      remainingLoan,
      salePrice,
    };
  }

  function simulate(config) {
    const rows = [];
    const operatingCostRate = config.taxRate + config.maintenanceRate + config.insuranceRate;
    const userCostRate = (
      config.downPaymentRate * config.returnRate
      + (1 - config.downPaymentRate) * config.mortgageRate
      + operatingCostRate
      - config.homeGrowthRate
      + (config.buyCostRate + config.sellCostRate) / config.stayYears
    );

    for (let waitYears = 0; waitYears <= config.maxWaitYears; waitYears += 1) {
      const price = homePriceAt(config, waitYears);
      const annualBudget = annualBudgetAt(config, waitYears);
      const rent = annualRentAt(config, waitYears);
      let assetsAtPurchase = config.assets;
      for (let year = 0; year < waitYears; year += 1) {
        assetsAtPurchase = assetsAtPurchase * (1 + config.returnRate) + (annualBudgetAt(config, year) - annualRentAt(config, year));
      }
      const downPayment = price * config.downPaymentRate;
      const buyCost = price * config.buyCostRate;
      const requiredCashBeforeEmergency = downPayment + buyCost;
      const requiredCash = requiredCashBeforeEmergency + config.emergencyFund;
      const loan = Math.max(0, price - downPayment);
      const annualLoanPayment = yearlyPayment(loan, config.mortgageRate, config.loanYears);
      const monthlyLoanPayment = annualLoanPayment / 12;
      const operatingCost = price * operatingCostRate;
      const annualHousingCash = annualLoanPayment + operatingCost;
      const rentInvest = annualBudget - rent;
      const buyInvest = annualBudget - annualHousingCash;
      let minBuyInvest = buyInvest;
      for (let ownedYear = 0; ownedYear < config.stayYears; ownedYear += 1) {
        const globalYear = waitYears + ownedYear;
        const futureOperatingCost = homePriceAt(config, globalYear) * operatingCostRate;
        const futureLoanPayment = ownedYear < config.loanYears ? annualLoanPayment : 0;
        const futureBuyInvest = annualBudgetAt(config, globalYear) - futureLoanPayment - futureOperatingCost;
        minBuyInvest = Math.min(minBuyInvest, futureBuyInvest);
      }
      const userCost = price * userCostRate;
      const financiallyBetter = rent >= userCost;
      const hasCash = assetsAtPurchase >= requiredCash;
      const hasBudget = minBuyInvest >= 0;
      const row = {
        waitYears,
        baseAnnualBudget: config.baseAnnualBudget,
        annualBudget,
        rent,
        rentInvest,
        userCost,
        userCostRate,
        price,
        assetsAtPurchase,
        requiredCash,
        requiredCashBeforeEmergency,
        loan,
        annualLoanPayment,
        monthlyLoanPayment,
        operatingCost,
        operatingCostRate,
        annualHousingCash,
        buyInvest,
        minBuyInvest,
        financiallyBetter,
        hasCash,
        hasBudget,
      };
      Object.assign(row, simulateNetWorth(config, waitYears, row));
      row.canBuy = row.financiallyBetter && row.hasCash && row.hasBudget;
      rows.push(row);
    }

    return rows;
  }

  function niceMax(value) {
    if (!Number.isFinite(value) || value <= 0) return 1;
    const exponent = Math.floor(Math.log10(value));
    const fraction = value / Math.pow(10, exponent);
    const niceFraction = fraction <= 1 ? 1 : fraction <= 2 ? 2 : fraction <= 5 ? 5 : 10;
    return niceFraction * Math.pow(10, exponent);
  }

  function niceMin(value) {
    if (!Number.isFinite(value) || value >= 0) return 0;
    return -niceMax(Math.abs(value));
  }

  function makeTicks(minValue, maxValue, count = 5) {
    const ticks = [];
    for (let index = 0; index <= count; index += 1) {
      ticks.push(minValue + (maxValue - minValue) * index / count);
    }
    return ticks;
  }

  function svgEl(name, attrs = {}, text = "") {
    const el = document.createElementNS("http://www.w3.org/2000/svg", name);
    Object.entries(attrs).forEach(([key, value]) => el.setAttribute(key, value));
    if (text) el.textContent = text;
    return el;
  }

  function points(rows, values, minValue, maxValue, plot) {
    const denom = Math.max(1, rows.length - 1);
    const span = Math.max(1, maxValue - minValue);
    return values.map((value, index) => {
      const x = plot.left + plot.width * index / denom;
      const y = plot.top + plot.height * (1 - (value - minValue) / span);
      return `${x.toFixed(1)},${y.toFixed(1)}`;
    }).join(" ");
  }

  function drawChart(rows) {
    const width = 1120;
    const height = 720;
    const left = 104;
    const right = 76;
    const markerStep = rows.length > 31 ? Math.ceil((rows.length - 1) / 10) : 1;
    const panels = [
      {
        title: "経済性: 家賃年額 vs 所有ユーザーコスト",
        top: 54,
        bottom: 214,
        series: [
          { label: "家賃", values: rows.map((row) => row.rent), className: "line-rent", color: "#146c94" },
          { label: "所有コスト", values: rows.map((row) => row.userCost), className: "line-own", color: "#b54708" },
        ],
      },
      {
        title: "資金: 購入時資産 vs 必要現金",
        top: 276,
        bottom: 436,
        series: [
          { label: "購入時資産", values: rows.map((row) => row.assetsAtPurchase), className: "line-asset", color: "#24715d" },
          { label: "必要現金", values: rows.map((row) => row.requiredCash), className: "line-cash", color: "#6941c6" },
        ],
      },
      {
        title: "結果: 賃貸継続との差額",
        top: 498,
        bottom: 642,
        series: [
          { label: "純資産差", values: rows.map((row) => row.netAdvantage), className: "line-advantage", color: "#475467" },
        ],
      },
    ];

    chart.replaceChildren();
    chart.append(svgEl("rect", { x: 0, y: 0, width, height, fill: "#ffffff", rx: 8 }));

    panels.forEach((panel) => {
      const plot = {
        left,
        right,
        top: panel.top,
        bottom: panel.bottom,
        width: width - left - right,
        height: panel.bottom - panel.top,
      };
      const values = panel.series.flatMap((series) => series.values);
      const minValue = niceMin(Math.min(...values));
      const maxValue = niceMax(Math.max(...values));
      const ticks = makeTicks(minValue, maxValue, 4);

      chart.append(svgEl("text", { x: plot.left, y: plot.top - 22, class: "panel-title" }, panel.title));
      ticks.forEach((tick) => {
        const span = Math.max(1, maxValue - minValue);
        const y = plot.top + plot.height * (1 - (tick - minValue) / span);
        chart.append(svgEl("line", { x1: plot.left, y1: y, x2: width - plot.right, y2: y, class: "grid" }));
        chart.append(svgEl("line", { x1: plot.left - 5, y1: y, x2: plot.left, y2: y, class: "axis" }));
        chart.append(svgEl("text", {
          x: plot.left - 10,
          y: y + 4,
          "text-anchor": "end",
          class: "tick-text",
        }, yen(tick)));
      });

      rows.forEach((row, index) => {
        const x = plot.left + plot.width * row.waitYears / Math.max(1, rows.length - 1);
        const showMarker = index === 0 || index === rows.length - 1 || row.waitYears % markerStep === 0;
        if (showMarker) {
          chart.append(svgEl("line", { x1: x, y1: plot.top, x2: x, y2: plot.bottom, class: "grid" }));
          if (panel === panels[panels.length - 1]) {
            chart.append(svgEl("text", {
              x,
              y: plot.bottom + 50,
              "text-anchor": "middle",
              class: "tick-text",
            }, `${row.waitYears}年`));
          }
        }
      });

      chart.append(svgEl("line", { x1: plot.left, y1: plot.bottom, x2: width - plot.right, y2: plot.bottom, class: "axis" }));
      chart.append(svgEl("line", { x1: plot.left, y1: plot.top, x2: plot.left, y2: plot.bottom, class: "axis" }));
      panel.series.forEach((series, index) => {
        const x = plot.left + index * 150;
        chart.append(svgEl("polyline", {
          points: points(rows, series.values, minValue, maxValue, plot),
          class: series.className,
        }));
        chart.append(svgEl("line", { x1: x, y1: plot.bottom + 22, x2: x + 34, y2: plot.bottom + 22, class: series.className }));
        chart.append(svgEl("text", { x: x + 42, y: plot.bottom + 26, fill: series.color, class: "legend" }, series.label));
      });
    });

    chart.append(svgEl("text", {
      x: width - 18,
      y: height - 14,
      "text-anchor": "end",
      fill: "#667085",
      class: "copyright-text",
    }, COPYRIGHT_NOTICE));
  }

  function purchaseStatus(row) {
    if (row.canBuy) return "可";
    const reasons = [];
    if (!row.financiallyBetter) reasons.push("経済性未達");
    if (!row.hasCash) reasons.push("資金不足");
    if (!row.hasBudget) reasons.push("年間予算不足");
    return reasons.join(" / ");
  }

  function updateMetrics(rows) {
    const best = rows.find((row) => row.canBuy);
    const highestAdvantage = rows.reduce((bestRow, row) => (
      !bestRow || row.netAdvantage > bestRow.netAdvantage ? row : bestRow
    ), null);
    const firstRow = rows[0];
    const target = best ?? highestAdvantage ?? firstRow;
    const conditionRow = best ?? firstRow;
    const status = best ? `${best.waitYears}年後` : "条件未達";
    const items = [
      ["現在の住居費込み年間予算", yen(firstRow.baseAnnualBudget), ""],
      ["購入条件", status, best ? "good" : "warn"],
      ["主な不可理由", best ? "なし" : purchaseStatus(firstRow), best ? "good" : "warn"],
      [`${conditionRow.waitYears}年後の購入後最低余力`, yen(conditionRow.minBuyInvest), conditionRow.minBuyInvest >= 0 ? "good" : "warn"],
      ["家賃年額", yen(target.rent), ""],
      ["所有ユーザーコスト", yen(target.userCost), ""],
      [`${target.waitYears}年後購入の純資産差`, signedYen(target.netAdvantage), target.netAdvantage >= 0 ? "good" : "warn"],
      ["比較対象年", `${target.waitYears}年後`, ""],
    ];

    metricsEl.replaceChildren(...items.map(([label, value, className]) => {
      const div = document.createElement("div");
      div.className = `metric ${className}`.trim();
      const span = document.createElement("span");
      span.textContent = label;
      const strong = document.createElement("strong");
      strong.textContent = value;
      div.append(span, strong);
      return div;
    }));
  }

  function renderTable(rows) {
    summaryRowsEl.replaceChildren(...rows.map((row) => {
      const tr = document.createElement("tr");
      [
        `${row.waitYears}年後`,
        yen(row.annualBudget),
        yen(row.rent),
        yen(row.rentInvest),
        yen(row.annualHousingCash),
        yen(row.minBuyInvest),
        yen(row.assetsAtPurchase),
        yen(row.requiredCash),
        purchaseStatus(row),
        signedYen(row.netAdvantage),
      ].forEach((value) => {
        const td = document.createElement("td");
        td.textContent = value;
        tr.append(td);
      });
      return tr;
    }));
  }

  function recalculate() {
    try {
      const config = readInputs();
      currentRows = simulate(config);
      updateMetrics(currentRows);
      drawChart(currentRows);
      renderTable(currentRows);
      errorEl.textContent = "";
    } catch (error) {
      errorEl.textContent = error.message;
    }
  }

  function saveCsv() {
    const headers = [
      "wait_years",
      "annual_budget",
      "annual_rent",
      "rent_investment",
      "annual_user_cost",
      "home_price",
      "assets_at_purchase",
      "required_cash",
      "loan",
      "monthly_loan_payment",
      "annual_housing_cash",
      "buy_investment",
      "minimum_buy_investment",
      "financially_better",
      "has_cash",
      "has_budget",
      "can_buy",
      "purchase_status",
      "rent_net_worth",
      "buy_net_worth",
      "net_advantage",
    ];
    const lines = [
      `# ${COPYRIGHT_NOTICE}`,
      headers.join(","),
      ...currentRows.map((row) => [
        row.waitYears,
        row.annualBudget.toFixed(2),
        row.rent.toFixed(2),
        row.rentInvest.toFixed(2),
        row.userCost.toFixed(2),
        row.price.toFixed(2),
        row.assetsAtPurchase.toFixed(2),
        row.requiredCash.toFixed(2),
        row.loan.toFixed(2),
        row.monthlyLoanPayment.toFixed(2),
        row.annualHousingCash.toFixed(2),
        row.buyInvest.toFixed(2),
        row.minBuyInvest.toFixed(2),
        row.financiallyBetter,
        row.hasCash,
        row.hasBudget,
        row.canBuy,
        purchaseStatus(row),
        row.rentNetWorth.toFixed(2),
        row.buyNetWorth.toFixed(2),
        row.netAdvantage.toFixed(2),
      ].join(",")),
    ];
    const blob = new Blob([lines.join("\n")], { type: "text/csv;charset=utf-8" });
    const url = URL.createObjectURL(blob);
    const anchor = document.createElement("a");
    anchor.href = url;
    anchor.download = "buy_timing_simulation.csv";
    anchor.click();
    URL.revokeObjectURL(url);
  }

  Object.values(inputs).forEach((input) => input.addEventListener("input", recalculate));
  document.getElementById("updateButton").addEventListener("click", recalculate);
  document.getElementById("saveCsvButton").addEventListener("click", saveCsv);
  recalculate();
</script>
</body>
</html>
