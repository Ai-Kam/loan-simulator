<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>購入タイミングシミュレータ</title>
  <meta http-equiv="refresh" content="0; url=index.html">
  <style>
    body {
      margin: 0;
      background: #f6f8fb;
      color: #152033;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      line-height: 1.5;
    }

    main {
      width: min(720px, calc(100vw - 28px));
      margin: 40px auto;
      background: #ffffff;
      border: 1px solid #d7dde7;
      border-radius: 8px;
      padding: 20px;
    }

    a {
      color: #0f766e;
      font-weight: 700;
    }
  </style>
</head>
<body>
<main>
  <h1>購入タイミングシミュレータ</h1>
  <p>購入タイミング機能は統合版に移動しました。</p>
  <p><a id="redirectLink" href="index.html">住宅購入・ローンシミュレータを開く</a></p>
</main>
<script>
  const defaultState = {
    v: 1,
    view: "buy",
    loan: {
      principal: 54000000,
      termYears: 35,
      scenario: "manual",
      ratePeriods: [
        { rate: 0.7, years: 5 },
        { rate: 0.8, years: 10 },
        { rate: 1.0, years: 20 },
      ],
    },
    buy: {
      assets: 8000000,
      returnRate: 4.0,
      monthlyRent: 180000,
      homePrice: 60000000,
      downPaymentRate: 10,
      emergencyFund: 3000000,
      annualBudget: 3960000,
      taxRate: 0.35,
      maintenanceRate: 0.8,
      insuranceRate: 0.1,
      buyCostRate: 6.0,
      sellCostRate: 3.5,
      stayYears: 20,
      maxWaitYears: 25,
    },
    assumptions: {
      rentScenario: "manual",
      rentPeriods: [{ rate: 1.0, years: 80 }],
      homeScenario: "manual",
      homePeriods: [{ rate: 0.5, years: 80 }],
      budgetScenario: "manual",
      budgetPeriods: [{ rate: 1.0, years: 80 }],
    },
    cashflow: { purchaseWaitYears: 0 },
  };

  function encodeState(value) {
    const bytes = new TextEncoder().encode(JSON.stringify(value));
    let binary = "";
    bytes.forEach((byte) => { binary += String.fromCharCode(byte); });
    return btoa(binary).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/g, "");
  }

  const target = `index.html#state=${encodeState(defaultState)}`;
  document.getElementById("redirectLink").href = target;
  location.replace(target);
</script>
</body>
</html>
